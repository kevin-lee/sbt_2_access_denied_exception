name: "repro restricted sbt 2.0.4"

# Runs sbt under a restricted token (runas /trustlevel:0x20000) so symlink
# creation fails like on a normal non-admin user machine and sbt's cache
# store falls back to copying real files into target/out.
#
# All variants use a fixed 3g heap so a GC pause cannot collect the abandoned
# test classloader and release its jar handles mid-run (that made earlier
# mutate runs pass by luck).
#
# Variants:
#   nochange           compile;test;test - the reported sequence as-is
#   set-manifest       adds a packageOption between the test runs: forces an
#                      organic re-package with no recompile while the previous
#                      test classloader still pins the old jar
#   set-manifest-close same but with -Dsbt.classloader.close=true; passes if
#                      the unclosed test classloader is the pinner
#   mutate             source change between test runs (recompile + repackage)
#   mutate-close       mutate with -Dsbt.classloader.close=true
on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [nochange, set-manifest, set-manifest-close, mutate, mutate-close]
    name: "sbt 2.0.4 / ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Pin sbt version
        run: Set-Content -Path project/build.properties -Value 'sbt.version=2.0.4'
      - name: Grant the user explicit write access to the workspace
        # Checked-out files carry ACLs that grant write via the Administrators
        # group, which the restricted token disables; the mutate command needs
        # a direct user grant to append to Test.scala.
        shell: pwsh
        run: icacls "$env:GITHUB_WORKSPACE" /grant "${env:USERNAME}:(OI)(CI)F" /T /Q
      - name: Prepare restricted runner script
        shell: pwsh
        run: |
          $commands = switch -Wildcard ('${{ matrix.variant }}') {
            'nochange'       { ';compile;test;test' }
            'set-manifest*'  { ';compile;test;set Compile / packageBin / packageOptions += reproManifestOption;test' }
            'mutate*'        { ';compile;test;mutate;test' }
          }
          $sbtOpts = '-Xms3g -Xmx3g'
          if ('${{ matrix.variant }}' -like '*-close') { $sbtOpts += ' -Dsbt.classloader.close=true' }
          @"
          @echo off
          cd /d $env:GITHUB_WORKSPACE
          set "JAVA_HOME=$env:JAVA_HOME"
          set "PATH=$env:PATH"
          set "SBT_OPTS=$sbtOpts"
          echo === privileges of the restricted process === > sbt-restricted.log
          whoami /priv >> sbt-restricted.log 2>&1
          call sbt --batch "$commands" >> sbt-restricted.log 2>&1
          echo %ERRORLEVEL% > exit-code.txt
          "@ | Set-Content run.cmd -Encoding ascii
      - name: Run sbt under restricted token
        shell: pwsh
        run: |
          runas /trustlevel:0x20000 "cmd /c $env:GITHUB_WORKSPACE\run.cmd"
          $deadline = (Get-Date).AddMinutes(12)
          while (-not (Test-Path exit-code.txt) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 10 }
          if (-not (Test-Path exit-code.txt)) { Write-Error "timed out waiting for restricted sbt run"; exit 2 }
          Write-Host "=== last 150 lines of sbt-restricted.log ==="
          Get-Content sbt-restricted.log -Tail 150
          exit [int](Get-Content exit-code.txt).Trim()
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "log-2.0.4-${{ matrix.variant }}"
          path: sbt-restricted.log
