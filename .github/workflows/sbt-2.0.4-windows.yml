name: "sbt 2.0.4 (Windows)"

on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Pin sbt version to 2.0.4
        run: Set-Content -Path project/build.properties -Value 'sbt.version=2.0.4'
      - name: Run compile, test, test in one sbt session
        run: sbt --batch compile test test
