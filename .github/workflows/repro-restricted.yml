name: "repro restricted (no symlink privilege)"

# GitHub windows runners are elevated, so sbt's cache store can symlink
# target/out jars to CAS blobs and the reported AccessDeniedException never
# triggers. These jobs run sbt under a restricted token
# (runas /trustlevel:0x20000), dropping SeCreateSymbolicLinkPrivilege the way
# a normal non-admin user machine does, so sbt falls back to copying real
# files into target/out.
#
# Variants:
#   nochange     compile;test;test         - the reported sequence as-is
#   mutate       compile;test;mutate;test  - forces a legitimate repackage
#                while the previous test classloader may still pin the jar
#   mutate-close same as mutate but with -Dsbt.classloader.close=true, which
#                should pass if the unclosed test classloader is the pinner
on:
  push:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sbt-version: ["2.0.3", "2.0.4"]
        variant: [nochange, mutate, mutate-close]
    name: "sbt ${{ matrix.sbt-version }} / ${{ matrix.variant }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: sbt/setup-sbt@v1
      - name: Pin sbt version
        run: Set-Content -Path project/build.properties -Value 'sbt.version=${{ matrix.sbt-version }}'
      - name: Prepare restricted runner script
        shell: pwsh
        run: |
          $commands = if ('${{ matrix.variant }}' -eq 'nochange') { ';compile;test;test' } else { ';compile;test;mutate;test' }
          $sbtOpts = if ('${{ matrix.variant }}' -eq 'mutate-close') { '-Dsbt.classloader.close=true' } else { '' }
          @"
          @echo off
          cd /d $env:GITHUB_WORKSPACE
          set "JAVA_HOME=$env:JAVA_HOME"
          set "PATH=$env:PATH"
          set "SBT_OPTS=$sbtOpts"
          echo === privileges of the restricted process === > sbt-restricted.log
          whoami /priv >> sbt-restricted.log 2>&1
          call sbt --batch "$commands" >> sbt-restricted.log 2>&1
          echo %ERRORLEVEL% > exit-code.txt
          "@ | Set-Content run.cmd -Encoding ascii
      - name: Run sbt under restricted token
        shell: pwsh
        run: |
          runas /trustlevel:0x20000 "cmd /c $env:GITHUB_WORKSPACE\run.cmd"
          $deadline = (Get-Date).AddMinutes(12)
          while (-not (Test-Path exit-code.txt) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 10 }
          if (-not (Test-Path exit-code.txt)) { Write-Error "timed out waiting for restricted sbt run"; exit 2 }
          Write-Host "=== last 150 lines of sbt-restricted.log ==="
          Get-Content sbt-restricted.log -Tail 150
          exit [int](Get-Content exit-code.txt).Trim()
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "log-${{ matrix.sbt-version }}-${{ matrix.variant }}"
          path: sbt-restricted.log
